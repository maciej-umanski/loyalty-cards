services:
  loyalty-cards:
    build: .
    container_name: loyalty-cards
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - loyalty-cards-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/cards').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  loyalty-cards-data:
